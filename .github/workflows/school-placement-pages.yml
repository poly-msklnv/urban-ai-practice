name: School placement Pages

on:
  push:
    branches: [main, feat/practice3-school-placement]
    paths: ["school-placement/**", "tests/test_pages_model.mjs", ".github/workflows/school-placement-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: school-placement-pages
  cancel-in-progress: true

jobs:
  build:
    # This preview belongs to Denis's fork; the upstream documentation deployment is unchanged.
    if: github.repository == 'mfthesun/urban-ai-practice'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r school-placement/requirements.txt
      - run: python school-placement/build_pages.py
      - run: node tests/test_pages_model.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/school-placement
  deploy:
    if: github.repository == 'mfthesun/urban-ai-practice'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
